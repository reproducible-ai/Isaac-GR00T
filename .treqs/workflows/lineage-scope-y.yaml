name: Dev lineage scope smoke Y

smoke:
  command: |
    set -euo pipefail
    roar --version
    roar tracer use preload
    roar init || true
    mkdir -p artifacts/lineage-scope-smoke
    roar run -n lineage_scope_y -- python3 -c "from pathlib import Path; Path('artifacts/lineage-scope-smoke/y.txt').write_bytes(b'reproducible-ai-dev-scope-smoke-y-v1\\n')"
  trace: "off"
