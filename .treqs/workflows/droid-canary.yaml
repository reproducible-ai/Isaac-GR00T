name: Isaac GR00T N1.7 DROID 100-step private canary

# Generated from the reproducible-ai clean-DAG scaffold. Every workload step is
# an explicit named `roar run`; TReqs executes those stages without nesting a
# second tracer. Generated data and model files live under tracked directories.

secrets:
  - HF_TOKEN

setup:
  command: |
    set -euo pipefail
    export PATH="$(python3 -m site --user-base)/bin:${PATH}"
    if command -v sudo >/dev/null 2>&1; then
      PRIVILEGE=(sudo -n)
    elif [ "$(id -u)" -eq 0 ]; then
      PRIVILEGE=()
    else
      echo "setup requires root access or passwordless sudo" >&2
      exit 1
    fi
    timeout --signal=TERM 60 python3 .treqs/scripts/check_hf_access.py
    rm -rf *.egg-info src/*.egg-info
    timeout --signal=TERM 120 python3 -m pip install --user --disable-pip-version-check uv==0.10.12
    command -v uv >/dev/null
    test "$(uv --version | awk '{print $1, $2}')" = "uv 0.10.12"
    if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v git-lfs >/dev/null 2>&1; then
      timeout --signal=TERM 180 "${PRIVILEGE[@]}" env DEBIAN_FRONTEND=noninteractive apt-get update
      timeout --signal=TERM 420 "${PRIVILEGE[@]}" env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=360 install -y ffmpeg git-lfs
    fi
    ffmpeg -version | head -1
    git lfs install --local
    TORCHCODEC_WHEEL=scripts/deployment/dgpu/wheels/torchcodec-0.8.0-cp312-cp312-linux_aarch64.whl
    if ! timeout --signal=TERM 180 git lfs pull --include="$TORCHCODEC_WHEEL" --exclude=""; then
      timeout --signal=TERM 180 git -c credential.helper= lfs fetch https://github.com/NVIDIA/Isaac-GR00T.git HEAD --include="$TORCHCODEC_WHEEL" --exclude=""
      git lfs checkout "$TORCHCODEC_WHEEL"
    fi
    python3 -c "import zipfile; assert zipfile.is_zipfile('scripts/deployment/dgpu/wheels/torchcodec-0.8.0-cp312-cp312-linux_aarch64.whl')"
    nvidia-smi
    timeout --signal=TERM 180 uv python install 3.12.13
    MANAGED_PYTHON="$(UV_PYTHON_PREFERENCE=only-managed uv python find 3.12.13)"
    test "$("$MANAGED_PYTHON" --version)" = "Python 3.12.13"
    timeout --signal=TERM 1200 uv sync --locked --python "$MANAGED_PYTHON" --no-install-project --extra dev
    test -f .venv/pyvenv.cfg
    grep -qx 'include-system-site-packages = false' .venv/pyvenv.cfg
    uv run --no-sync python -c "from torchcodec.decoders import VideoDecoder; print('torchcodec decoder import OK')"
    uv tool install --python 3.12 --force --with huggingface-hub roar-cli==0.4.5
    "${PRIVILEGE[@]}" ln -sf "$(command -v roar)" /usr/local/bin/roar
    test "$(env PATH=/usr/local/bin:/usr/bin:/bin roar --version)" = "roar, version 0.4.5"
    roar tracer use preload
    roar tracer
    roar init || true
    timeout --signal=TERM 120 uv run --no-sync pytest -q tests/treqs/test_droid_canary_contract.py
  trace: "off"

fetch_droid:
  command: |
    set -euo pipefail
    export PATH="$PWD/.venv/bin:/usr/local/bin:/opt/pytorch/bin:$PATH"
    roar run -n fetch_droid -- env PYTHONUNBUFFERED=1 HF_HOME=/tmp/isaac-groot-hf timeout --signal=TERM 2400 python .treqs/scripts/prepare_droid_canary.py
  trace: "off"

train:
  command: |
    set -euo pipefail
    export PATH="$PWD/.venv/bin:/usr/local/bin:/opt/pytorch/bin:$PATH"
    roar run -n train -- env PYTHONUNBUFFERED=1 HF_HOME=/tmp/isaac-groot-hf timeout --signal=TERM 3600 python .treqs/scripts/run_droid_canary.py
  trace: "off"

evaluate:
  command: |
    set -euo pipefail
    export PATH="$PWD/.venv/bin:/usr/local/bin:/opt/pytorch/bin:$PATH"
    roar run -n evaluate -- env PYTHONUNBUFFERED=1 timeout --signal=TERM 300 python .treqs/scripts/verify_droid_canary.py
  trace: "off"

package:
  command: |
    set -euo pipefail
    export PATH="$PWD/.venv/bin:/usr/local/bin:/opt/pytorch/bin:$PATH"
    roar run -n package -- env PYTHONUNBUFFERED=1 HF_HOME=/tmp/isaac-groot-hf timeout --signal=TERM 300 python .treqs/scripts/package_droid_canary.py
  trace: "off"

label:
  command: |
    set -euo pipefail
    export PATH="$PWD/.venv/bin:/usr/local/bin:/opt/pytorch/bin:$PATH"
    SOURCE_COMMIT="$(git rev-parse HEAD)"
    while IFS= read -r model_artifact; do
      roar label set artifact "$model_artifact" model.name=isaac-groot-droid-canary model.version=0.1.0 license.id=LicenseRef-NVIDIA-License license.name='NVIDIA License (non-commercial research/evaluation)' description='Isaac GR00T N1.7 100-step DROID fine-tuning canary' documentation.url="https://github.com/reproducible-ai/Isaac-GR00T/blob/${SOURCE_COMMIT}/.treqs/README.md"
    done < <(python -c 'import json; result=json.load(open("artifacts/droid-canary/checkpoint-100/evaluation.json")); print(*(item["path"] for item in result["model_files"]), sep="\n")')
  trace: "off"

publish:
  glaas_creds: true
  command: |
    set -euo pipefail
    export PATH="$PWD/.venv/bin:/usr/local/bin:/opt/pytorch/bin:$PATH"
    CHECKPOINT=artifacts/droid-canary/checkpoint-100
    for document in README.md LICENSE NOTICE NVIDIA_OPEN_MODEL_LICENSE.md; do
      test -s "$CHECKPOINT/$document"
    done
    roar status --untracked-dirs
    roar put "$CHECKPOINT" hf://reproducible-ai/harness-test-gr00t-droid100-issue-30/artifacts/gr00t-droid-100step --private --yes --no-tag -m "GR00T N1.7 100-step private DROID canary"
  trace: "off"
