name: Dev lineage scope smoke Y public variant

smoke:
  command: |
    set -euo pipefail
    roar --version
    roar tracer use preload
    roar init || true
    mkdir -p artifacts/lineage-scope-smoke
    roar run -n lineage_scope_y_public -- python3 -c "from pathlib import Path; payload=b'reproducible-ai-dev-scope-smoke-y-v1\\n'; Path('artifacts/lineage-scope-smoke/y.txt').write_bytes(payload)"
  trace: "off"
